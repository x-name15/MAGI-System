[package]
name = "magi-client"
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-only"
description = "Asynchronous CLI orchestrator and NERV TUI for MAGI System"

[[bin]]
name = "magi"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"
comfy-table = "7.1"
ratatui = "0.29"
crossterm = "0.28"
dotenvy = "0.15"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"