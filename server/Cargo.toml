[package]
name = "magi-server"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-only"
description = "SpacetimeDB WebAssembly module and consensus engine for MAGI System"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spacetimedb = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
